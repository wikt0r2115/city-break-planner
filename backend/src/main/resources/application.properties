spring.application.name=city-break-planner
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:./city-break-planner.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=1000
# Health ma odpowiedzieć 503 również wtedy, gdy baza jest niedostępna przy starcie.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
