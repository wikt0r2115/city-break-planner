worker_processes auto;
pid /tmp/nginx.pid;

# Nginx request error messages can include read-capability tokens from the URL.
# Keep the status-only access log; do not write request-context error messages.
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    log_format status_only '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent';
    access_log /dev/stdout status_only;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            return 204;
        }

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            # Resolve again when Docker replaces the backend container.
            set $api_backend backend:8080;
            proxy_pass http://$api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location = /index.html {
            add_header Cache-Control no-store;
            add_header Referrer-Policy no-referrer always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
