name: city-break-planner

services:
  backend:
    build:
      context: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/city-break-planner.db
      APP_CORS_ALLOWED_ORIGINS: ${APP_FRONTEND_BASE_URL:-http://localhost:${APP_PORT:-8080}}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:${APP_PORT:-8080}}
      APP_DATA_MODE: ${APP_DATA_MODE:-live}
      APP_SOURCE_TIMEOUT_SECONDS: ${APP_SOURCE_TIMEOUT_SECONDS:-3}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-off}
      APP_AI_MODEL: ${APP_AI_MODEL:-gpt-6-luna}
      APP_AI_TIMEOUT_SECONDS: ${APP_AI_TIMEOUT_SECONDS:-8}
      APP_AI_DAILY_REQUESTS: ${APP_AI_DAILY_REQUESTS:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - planner_data:/data
    read_only: true
    tmpfs:
      # sqlite-jdbc loads its native library from the temporary directory.
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  planner_data:
